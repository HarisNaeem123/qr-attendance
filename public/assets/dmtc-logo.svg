<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#F2A900" />
      <stop offset="100%" stop-color="#D48800" />
    </linearGradient>
    <radialGradient id="blueCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E5CAD" />
      <stop offset="100%" stop-color="#06326E" />
    </radialGradient>
  </defs>

  <!-- Outer Cog / Seal Border -->
  <circle cx="55" cy="55" r="52" fill="#333333" />
  <circle cx="55" cy="55" r="50" fill="url(#goldGrad)" stroke="#B87A00" stroke-width="1.5"/>

  <!-- Decorative Inner Ring -->
  <circle cx="55" cy="55" r="43" fill="none" stroke="#2D5A27" stroke-width="2.5" stroke-dasharray="3 2" />
  <circle cx="55" cy="55" r="40" fill="#2E7D32" />
  <circle cx="55" cy="55" r="37" fill="#FFFFFF" />

  <!-- Center Blue Shield / Disc -->
  <circle cx="55" cy="55" r="34" fill="url(#blueCenter)" stroke="#F2A900" stroke-width="2"/>

  <!-- DMTC Letters -->
  <g transform="translate(55, 55)">
    <!-- Stylized D enclosing or preceding MTC -->
    <path d="M-22 -14 C-22 -20, -16 -23, -6 -23 C8 -23, 20 -14, 20 0 C20 14, 8 23, -6 23 C-16 23, -22 20, -22 14 Z" fill="none" stroke="#F9BA15" stroke-width="3.5"/>
    <text x="-3" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      MTC
    </text>
    <text x="-16" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#F9BA15" text-anchor="middle">
      D
    </text>
  </g>
</svg>
